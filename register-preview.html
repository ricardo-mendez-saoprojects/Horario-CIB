<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link rel="stylesheet" href="app.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width: 500px;">
    <div class="card">
      <div class="card-body p-4">
        <h2 class="mb-3">Crear cuenta</h2>
        <div class="alert alert-danger">El email ya existe</div>
        <form>
          <div class="mb-3"><label class="form-label">Usuario</label><input class="form-control" type="text" value="nuevo.usuario"></div>
          <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" value="nuevo@ejemplo.es"></div>
          <div class="mb-3"><label class="form-label">Contraseña</label><input class="form-control" type="password" value="12345678"></div>
          <button class="btn btn-primary w-100" type="button">Registrarme</button>
        </form>
        <div class="mt-3 text-center"><a href="login-preview.html">Volver al login</a></div>
      </div>
    </div>
  </div>
</body>
</html>
