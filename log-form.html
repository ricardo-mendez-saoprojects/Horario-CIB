<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nuevo registro · Horario CIB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/build/css/app.css">
</head>
<body>
<script>if(localStorage.getItem('horario-theme')==='dark')document.body.classList.add('dark-mode');</script>

<nav class="nav">
  <div class="nav__inner">
    <a class="nav__brand" href="dashboard.html">Horario CIB</a>
    <span class="nav__user">Sesión de <strong>amiller</strong></span>
    <button class="nav__burger" type="button" aria-label="Abrir menú" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
    <div class="nav__links">
      <a class="nav__link" href="dashboard.html">Dashboard</a>
      <a class="nav__link" href="logs.html">Registros</a>
      <a class="nav__link" href="log-form.html">Nuevo registro</a>
      <a class="nav__link" href="change-password.html">Contraseña</a>
      <a class="nav__link nav__link--admin" href="admin-users.html">Usuarios</a>
      <a class="nav__link" href="login.html">Salir</a>
      <button class="theme-toggle" type="button" aria-label="Cambiar tema" aria-pressed="false">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>

<main>
  <div class="page-head">
    <div>
      <h1>Nuevo registro</h1>
      <p class="page-head__sub">Fecha, hora de entrada y de salida</p>
    </div>
    <div class="page-actions">
      <a class="btn btn--ghost" href="logs.html">Volver</a>
    </div>
  </div>

  <div class="card">
    <div class="card__body">
      <form>
        <div class="form-grid">
          <div class="field-4">
            <label class="form-label" for="fecha">Fecha</label>
            <input class="form-control" type="date" id="fecha" value="2026-05-18">
          </div>
          <div class="field-4">
            <label class="form-label" for="entrada">Hora de entrada</label>
            <input class="form-control" type="time" id="entrada" value="08:00">
          </div>
          <div class="field-4">
            <label class="form-label" for="salida">Hora de salida</label>
            <input class="form-control" type="time" id="salida" value="15:10">
          </div>
          <div class="field-8">
            <label class="form-label" for="notas">Notas</label>
            <input class="form-control" type="text" id="notas" value="Reunión de coordinación">
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn--primary" type="button">Guardar</button>
          <a class="btn btn--outline" href="logs.html">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</main>

<footer class="footer">Registro de jornada en el CIB · Demo visual sin backend</footer>
<script src="public/build/js/main.min.js"></script>
</body>
</html>
