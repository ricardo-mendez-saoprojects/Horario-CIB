<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta · Horario CIB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="public/build/css/app.css">
</head>
<body>
<script>if(localStorage.getItem('horario-theme')==='dark')document.body.classList.add('dark-mode');</script>

<div class="auth">
  <div class="auth__box">
    <div class="auth__brand">Horario CIB</div>
    <div class="card">
      <div class="card__body">
        <h1 class="mb-4">Crear cuenta</h1>
        <div class="alert alert--danger" role="alert">El email ya existe</div>
        <form>
          <div class="field">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" type="text" id="username" name="username" value="nuevo.usuario" autocomplete="username">
          </div>
          <div class="field">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" type="email" id="email" name="email" value="nuevo@ejemplo.es" autocomplete="email">
          </div>
          <div class="field">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" type="password" id="password" name="password" value="12345678" autocomplete="new-password">
          </div>
          <button class="btn btn--primary btn--block" type="button">Registrarme</button>
        </form>
        <div class="auth__foot"><a href="login.html">Volver al login</a></div>
      </div>
    </div>
  </div>
</div>

<footer class="footer">Registro de jornada en el CIB · Demo visual sin backend</footer>
<script src="public/build/js/main.min.js"></script>
</body>
</html>
