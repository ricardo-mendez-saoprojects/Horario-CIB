<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Nuevo registro demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="app.css"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid px-4 d-flex align-items-center">
    <div class="me-4">
      <a class="navbar-brand mb-0 h1" href="dashboard-preview.html">Horario CIB</a>
    </div>
    <div class="col-4 d-flex justify-content-center">
      <span class="text-white fw-semibold">amiller</span>
    </div>
    <div class="ms-auto d-flex align-items-center gap-2">
      <a class="btn btn-sm btn-outline-light" href="dashboard-preview.html">Dashboard</a>
      <a class="btn btn-sm btn-outline-light" href="logs-preview.html">Registros</a>
      <a class="btn btn-sm btn-outline-light" href="log-form-preview.html">+ Nuevo registro</a>
      <a class="btn btn-sm btn-outline-light" href="change-password-preview.html">Cambiar la contraseña</a>
      <a class="btn btn-sm btn-warning" href="admin-users-preview.html">Usuarios</a>
      <a class="btn btn-sm btn-outline-light" href="login-preview.html">Salir</a>
    </div>
  </div>
</nav>
<main class="container-fluid py-4 px-4">

<div class="d-flex align-items-center justify-content-between mb-3">
  <div>
    <h1 class="h3 mb-0">Nuevo registro</h1>
    <div class="text-muted">Fecha, entrada y salida.</div>
  </div>
  <div><a class="btn btn-outline-secondary" href="logs-preview.html">Volver</a></div>
</div>

<div class="card">
  <div class="card-body">
    <form>
      <div class="row g-3">
        <div class="col-md-4"><label class="form-label">Fecha</label><input class="form-control" type="date" value="2026-05-18"></div>
        <div class="col-md-4"><label class="form-label">Hora de entrada</label><input class="form-control" type="time" value="08:00"></div>
        <div class="col-md-4"><label class="form-label">Hora de salida</label><input class="form-control" type="time" value="15:10"></div>
        <div class="col-md-8"><label class="form-label">Notas</label><input class="form-control" type="text" value="Reunión de coordinación"></div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="button">Guardar</button>
        <a class="btn btn-outline-secondary" href="logs-preview.html">Cancelar</a>
      </div>
    </form>
    <div class="alert alert-danger mt-3">La hora de salida no puede ser anterior a la de entrada</div>
  </div>
</div>

</main>
<footer class="container container-narrow pb-4 text-muted small">
  <hr/>
  <div>Registro de jornada en el CIB · Demo visual sin backend</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
